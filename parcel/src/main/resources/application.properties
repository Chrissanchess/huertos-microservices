spring.application.name=parcel-service
server.port=8081

# Base de datos (Supabase): todos los valores salen de variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true

# SSL/TLS: el keystore ya no vive en el repositorio
server.ssl.enabled=true
server.ssl.key-store=${KEYSTORE_PATH}
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=huertos