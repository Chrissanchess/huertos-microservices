spring.application.name=garden-composite-service
server.port=8082

# SSL/TLS del propio servicio (ruta y clave por variable de entorno)
server.ssl.enabled=true
server.ssl.key-store=${KEYSTORE_PATH}
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=huertos

# Cliente hacia Parcel: HTTPS validando el certificado con un truststore
parcel-service.base-url=https://localhost:8081
parcel-service.connect-timeout-ms=2000
parcel-service.read-timeout-ms=3000
parcel-service.truststore-path=${TRUSTSTORE_PATH}
parcel-service.truststore-password=${TRUSTSTORE_PASSWORD}